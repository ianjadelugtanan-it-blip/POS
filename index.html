<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Find — Thrift Shop</title>
  </head>
  <body>
    <div id="root">
      <!-- Warm Boutique Initial Splash Screen (Renders Instantly!) -->
      <style>
        .splash-container {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #FAF6EF; /* Warm boutique cream background */
          z-index: 9999;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .splash-logo-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          animation: splash-pulse 1.8s infinite ease-in-out;
        }
        .splash-store-name {
          font-size: 2.5rem;
          font-weight: 700;
          color: #5C3D2E; /* Vintage Dark Brown logo color */
          letter-spacing: 0.1em;
          text-transform: uppercase;
          margin-bottom: 0.25rem;
          font-family: 'Playfair Display', Georgia, serif;
        }
        .splash-tagline {
          font-size: 0.85rem;
          color: #A3937C; /* Sand muted tagline */
          font-weight: 600;
          letter-spacing: 0.25em;
          text-transform: uppercase;
          margin-bottom: 2rem;
        }
        .splash-spinner {
          width: 32px;
          height: 32px;
          border: 3px solid rgba(92, 61, 46, 0.08);
          border-top: 3px solid #5C3D2E;
          border-radius: 50%;
          animation: splash-spin 0.8s linear infinite;
        }
        @keyframes splash-pulse {
          0%, 100% { opacity: 0.85; transform: scale(0.98); }
          50% { opacity: 1; transform: scale(1); }
        }
        @keyframes splash-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
      <div class="splash-container">
        <div class="splash-logo-container">
          <div class="splash-store-name">The Find</div>
          <div class="splash-tagline">Thrift Shop</div>
          <div class="splash-spinner"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
